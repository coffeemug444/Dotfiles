shell zsh

include DotGov.conf

enable_audio_bell no

font_size 13
adjust_line_height 125%

# vsplit in current directory
map ctrl+shift+enter launch --cwd=current --location=vsplit
# new tab in current directory
map ctrl+shift+t launch --cwd=current --type=tab --location=after
# new window in current directory
map ctrl+shift+n launch --type=os-window --cwd=current
# detach tab to new OS window
map shift+f1 detach_tab new-window

font_family family="FiraCode Nerd Font Mono"
bold_font auto
italic_font auto
bold_italic_font auto

remember_window_size no
initial_window_width 1100
initial_window_height 650
startup_session ~/.config/kitty/sessions/max.conf

window_margin_width 10

active_border_color #c1c2c7
inactive_border_color #707173
window_border_width 1.5pt

enabled_layouts Tall, *

tab_bar_style powerline
tab_powerline_style slanted

confirm_os_window_close 0
close_on_child_death yes
